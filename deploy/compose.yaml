name: appdock

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${APPDOCK_POSTGRES_PASSWORD:-${ZEALOT_POSTGRES_PASSWORD:?set in .env}}
      POSTGRES_DB: appdock
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdock"]
      interval: 10s
      timeout: 5s
      retries: 10

  appdock:
    image: appdock:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      RAILS_ENV: production
      APPDOCK_POSTGRES_HOST: postgres
      APPDOCK_POSTGRES_PORT: 5432
      APPDOCK_POSTGRES_USERNAME: postgres
      APPDOCK_POSTGRES_DB_NAME: appdock
      APPDOCK_DOMAIN: ${APPDOCK_DOMAIN:-${ZEALOT_DOMAIN:?set in .env}}
      APPDOCK_TRUSTED_LAN: "true"
      APPDOCK_SKIP_SAMPLE_DATE: "true"
      APPDOCK_GUEST_MODE: "false"
      APPDOCK_REGISTER_ENABLED: "false"
      APPDOCK_LOGIN_ENABLED: "true"
      APPDOCK_PASSWORDLESS_LOGIN_ENABLED: "false"
      APPDOCK_SENTRY_DISABLE: "true"
    volumes:
      - ./data/uploads:/app/public/uploads
      - ./data/backup:/app/public/backup
      - ./data/log:/app/log
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy=off 127.0.0.1/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s

  web:
    image: caddy:2.11.9
    environment:
      APPDOCK_DOMAIN: ${APPDOCK_DOMAIN:-${ZEALOT_DOMAIN:?set in .env}}
    restart: unless-stopped
    depends_on:
      appdock:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
